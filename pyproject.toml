[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-quant-bench"
version = "0.1.0"
description = "Convert an HF causal LM to every quant format your hardware supports, then benchmark agentic tool-calling cost per format."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hf-quant-bench = "hf_quant_bench.cli:main"
