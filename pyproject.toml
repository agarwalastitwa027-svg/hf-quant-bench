[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-quant-bench"
version = "0.1.0"
description = "Convert an HF causal LM to every quant format your hardware supports, then benchmark agentic tool-calling cost per format."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hf-quant-bench = "hf_quant_bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# All tests here are plain functions -- disabling class-based collection
# avoids a spurious warning from bench/cases.py's TestCase dataclass (a
# project data type, not a test class) matching pytest's default "Test*"
# class-name convention.
python_classes = []
