- id: long_context_needle
  category: long_context
  max_steps: 4
  prompt: |
    Below is an internal engineering log. Read it, then at the end, calculate
    the passcode mentioned in the log multiplied by 2, using the calculator tool.

    --- LOG START ---
    {{LONG_FILLER_2000_WORDS}}
    Note from ops: today's rotating access passcode is 4471. Do not share it outside the team.
    {{LONG_FILLER_2000_WORDS}}
    --- LOG END ---

    What is the passcode multiplied by 2?
  available_tools: [calculator]
  expected_behavior: tool_call
  expected_trajectory:
    - tool: calculator
      arguments: {expression: "4471 * 2"}
  optimal_steps: 2
  required_facts: ['8942']
  judge_notes: "Tests retrieval of a single fact (passcode=4471) buried near the middle of a long filler document, near this model's practical context limit. The needle appears once, surrounded by generic filler on both sides."

