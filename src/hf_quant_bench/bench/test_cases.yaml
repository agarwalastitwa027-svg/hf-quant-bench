- id: multistep_calendar_then_calc
  category: multi_step
  prompt: "Look at my calendar for 2026-09-01, take the start time of the first event, and calculate how many hours that is after 06:00 (e.g. if it starts at 09:00, the answer is 3)."
  available_tools: [get_calendar_events, calculator]
  expected_behavior: tool_call
  expected_trajectory:
    - tool: get_calendar_events
      arguments: {date: "2026-09-01"}
    - tool: calculator
      arguments: {expression: "9 - 6"}
  optimal_steps: 3
  required_facts: ['3']
  judge_notes: "get_calendar_events('2026-09-01') deterministically returns a first event starting at 09:00 in this harness. Grader tolerance: any calculator expression evaluating to 3 is acceptable even if the exact string differs; see metrics_rule for numeric-equivalence matching."

