# Agentic tool-calling test suite.
#
# Each case:
#   id                  unique string
#   category            one of: single_simple, single_nested, multi_step,
#                        no_tool, distractor, clarify, long_context
#   prompt              the user's message (string)
#   available_tools     list of tool names exposed to the model this turn
#                        (from bench/tools.py TOOLS registry)
#   expected_behavior   "tool_call" | "no_tool" | "clarify"
#   expected_trajectory list of {tool, arguments} the model SHOULD call, in
#                        order (empty for no_tool / clarify cases). Argument
#                        values are matched exactly for scalars; grader does
#                        light normalization (str<->number, case-insensitive
#                        strings) — see bench/metrics_rule.py.
#   optimal_steps       the minimum number of trajectory steps a fully
#                        correct model needs: len(expected_trajectory) + 1
#                        (one step per tool call, plus the final answering
#                        turn), or 1 for no_tool/clarify cases. Drives the
#                        deterministic path_optimization metric:
#                        clamp(optimal_steps / actual_steps, 0, 1), scored 0
#                        instead if the trajectory hit the step cap without
#                        terminating (see `timeout_rate` in results.csv).
#   required_facts      concrete values that MUST appear (substring match
#                        for text, tolerance-based numeric match for
#                        numbers -- see bench/metrics_rule.py) in the
#                        model's final answer for it to be complete. Always
#                        derived from the REAL, deterministic mock tool
#                        output for expected_trajectory's last call (ground
#                        truth computed directly from bench/tools.py, not
#                        guessed) -- e.g. get_weather -> [temperature,
#                        location], calculator -> [result]. Empty for
#                        no_tool/clarify cases (nothing to check) and for a
#                        few specific cases where no safe deterministic
#                        literal exists (a zero-event calendar day has no
#                        single string every correct paraphrase of "you're
#                        free" would contain) -- see the project writeup for
#                        the full list and why. Drives the deterministic
#                        answer_completeness metric: matched / total,
#                        computed only over cases with a non-empty list (see
#                        metrics_rule.py for how no_tool/clarify cases are
#                        scored and excluded from that average instead).
#   judge_notes         free-text context for the OPTIONAL --local-judge
#                        pass only (off by default -- see README). Not used
#                        by the primary, always-on rule-based metrics above.
#   max_steps           optional override of the global step cap.

- id: simple_weather_1
  category: single_simple
  prompt: "What's the weather like in Tokyo right now?"
  available_tools: [get_weather]
  expected_behavior: tool_call
  expected_trajectory:
    - tool: get_weather
      arguments: {location: "Tokyo"}
  optimal_steps: 2
  required_facts: ['-4.3', 'Tokyo']
  judge_notes: "One tool call, then a natural-language answer stating the returned temperature and conditions."

