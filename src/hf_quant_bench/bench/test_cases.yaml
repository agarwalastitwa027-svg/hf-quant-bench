  expected_trajectory:
    - tool: web_search
      arguments: {query: "capital of France"}
    - tool: get_weather
      arguments: {location: "Paris"}
  optimal_steps: 3
  required_facts: ['32.6', 'Paris']
  judge_notes: "The second tool call's argument (Paris) must come from the first tool's result, not be guessed upfront."

